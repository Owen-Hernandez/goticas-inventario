<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Inventario{% endblock %} — Goticas de Aceite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0d0f14;
      --surface:   #13161e;
      --surface2:  #1a1e2a;
      --surface3:  #202435;
      --border:    #252a3a;
      --border2:   #2e3448;
      --accent:    #f5a623;
      --accent2:   #e8823a;
      --green:     #2ecc8a;
      --red:       #e05c5c;
      --blue:      #4a9eff;
      --text:      #e8eaf0;
      --text2:     #b0b7cc;
      --muted:     #5a6180;
      --sidebar-w: 200px;
      --topbar-h:  48px;
      --radius:    8px;
      --radius-sm: 5px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .sidebar-brand {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
    }
    .brand-text { min-width: 0; }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .sidebar-nav {
      flex: 1;
      padding: 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow-y: auto;
    }

    .nav-section {
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 8px 3px;
      font-weight: 700;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text2);
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.12s ease;
      white-space: nowrap;
    }
    .nav-link:hover { background: var(--surface2); color: var(--text); }
    .nav-link.active {
      background: rgba(245,166,35,0.1);
      color: var(--accent);
      font-weight: 600;
    }
    .nav-link .icon { font-size: 0.85rem; width: 16px; text-align: center; flex-shrink: 0; }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }
    .sidebar-footer .date-text {
      font-size: 0.63rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .status-row {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.63rem; color: var(--green);
      margin-bottom: 3px;
    }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── MAIN ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      min-width: 0;
    }

    .topbar {
      padding: 0 20px;
      height: var(--topbar-h);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .topbar h1 {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .topbar-tag {
      font-size: 0.68rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ── CONTENT ── */
    .content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 20px;
    }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── KPI ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      border-left: 3px solid transparent;
    }
    .kpi.amber { border-left-color: var(--accent); }
    .kpi.green { border-left-color: var(--green); }
    .kpi.blue  { border-left-color: var(--blue); }
    .kpi.red   { border-left-color: var(--red); }
    .kpi-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .kpi-value {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .kpi-value.amber { color: var(--accent); }
    .kpi-value.green { color: var(--green); }
    .kpi-value.blue  { color: var(--blue); }
    .kpi-value.red   { color: var(--red); }
    .kpi-sub { font-size: 0.62rem; color: var(--muted); margin-top: 4px; }

    /* ── GRIDS ── */
    .grid-2    { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-form { display: grid; grid-template-columns: 320px 1fr; gap: 12px; }
    .grid-dash { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
    .grid-cost { display: grid; grid-template-columns: 1fr 280px; gap: 12px; }

    /* ── FORMS ── */
    .form-col { display: flex; flex-direction: column; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      outline: none;
      transition: border 0.12s;
      width: 100%;
    }
    .form-group input:focus,
    .form-group select:focus { border-color: var(--accent); }
    .form-group select option { background: var(--surface2); }
    .form-hint { font-size: 0.62rem; color: var(--muted); margin-top: 2px; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.12s ease;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #0d0f14; }
    .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
    .btn-ghost { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: rgba(224,92,92,0.12); color: var(--red); border: 1px solid rgba(224,92,92,0.25); }
    .btn-danger:hover { background: var(--red); color: #fff; }
    .btn-full { width: 100%; }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--surface2); }
    th {
      padding: 8px 12px;
      text-align: left;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }
    td {
      padding: 8px 12px;
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
      color: var(--text);
    }
    tbody tr:hover { background: rgba(255,255,255,0.015); }
    .td-sub { font-size: 0.65rem; color: var(--muted); }

    /* ── BADGES ── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 7px; border-radius: 20px;
      font-size: 0.62rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .badge-green { background: rgba(46,204,138,0.12); color: var(--green); }
    .badge-red   { background: rgba(224,92,92,0.12);  color: var(--red); }
    .badge-amber { background: rgba(245,166,35,0.12); color: var(--accent); }

    /* ── DIVIDER ── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

    /* ── ALERTS ── */
    #alert-box {
      position: fixed; top: 12px; right: 12px;
      z-index: 9999; display: flex; flex-direction: column; gap: 6px;
    }
    .alert {
      padding: 9px 14px; border-radius: var(--radius-sm);
      font-size: 0.78rem; font-weight: 500;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      animation: slideIn 0.18s ease;
      display: flex; align-items: center; gap: 7px;
      min-width: 220px; max-width: 300px;
    }
    .alert-success { background: var(--surface2); border: 1px solid var(--green); color: var(--green); }
    .alert-error   { background: var(--surface2); border: 1px solid var(--red);   color: var(--red); }
    @keyframes slideIn { from{opacity:0;transform:translateX(12px)} to{opacity:1;transform:translateX(0)} }

    /* ── UTILS ── */
    .mt-2  { margin-top: 8px; }
    .mt-3  { margin-top: 12px; }
    .mt-4  { margin-top: 16px; }
    .gap-2 { gap: 8px; }
    .text-accent { color: var(--accent); }
    .text-green  { color: var(--green); }
    .text-red    { color: var(--red); }
    .text-blue   { color: var(--blue); }
    .text-muted  { color: var(--muted); }
    .text-sm     { font-size: 0.73rem; }
    .fw-bold     { font-weight: 700; }
    .mono        { font-family: 'Courier New', monospace; font-size: 0.72rem; }
    .flex        { display: flex; }
    .flex-center { display: flex; align-items: center; }
    .flex-between{ display: flex; align-items: center; justify-content: space-between; }
    .flex-col    { display: flex; flex-direction: column; }
    .w-full      { width: 100%; }

    /* ── BAR ── */
    .bar-track { background: var(--surface2); border-radius: 3px; height: 4px; overflow: hidden; flex: 1; }
    .bar-fill  { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

    /* ── MOV LIST ── */
    .mov-list { display: flex; flex-direction: column; gap: 5px; }
    .mov-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .mov-icon { font-size: 0.9rem; flex-shrink: 0; }
    .mov-info { flex: 1; min-width: 0; }
    .mov-name { font-size: 0.76rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mov-date { font-size: 0.62rem; color: var(--muted); }
    .mov-qty  { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">🫙</div>
    <div class="brand-text">
      <div class="brand-name">Goticas de Aceite</div>
      <div class="brand-sub">Inventario</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Principal</div>
    <a href="/" class="nav-link {% if active == 'dashboard' %}active{% endif %}">
      <span class="icon">📊</span> Dashboard
    </a>
    <div class="nav-section">Inventario</div>
    <a href="/entradas" class="nav-link {% if active == 'entradas' %}active{% endif %}">
      <span class="icon">📥</span> Entradas
    </a>
    <a href="/salidas" class="nav-link {% if active == 'salidas' %}active{% endif %}">
      <span class="icon">📤</span> Salidas
    </a>
    <a href="/ajustes" class="nav-link {% if active == 'ajustes' %}active{% endif %}">
      <span class="icon">⚖️</span> Ajustes
    </a>
    <div class="nav-section">Configuración</div>
    <a href="/productos" class="nav-link {% if active == 'productos' %}active{% endif %}">
      <span class="icon">📦</span> Productos
    </a>
    <a href="/costos" class="nav-link {% if active == 'costos' %}active{% endif %}">
      <span class="icon">💰</span> Costos
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="status-row"><div class="dot"></div> Sistema activo</div>
    <div class="date-text" id="current-date">—</div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <h1>{% block page_title %}Inventario{% endblock %}</h1>
    <span class="topbar-tag" id="topbar-date">—</span>
  </div>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</main>

<div id="alert-box"></div>

<script>
  const now = new Date();
  const opts = { weekday:'long', day:'numeric', month:'long', year:'numeric' };
  const dateStr = now.toLocaleDateString('es-CO', opts);
  document.getElementById('current-date').textContent = dateStr;
  document.getElementById('topbar-date').textContent = dateStr;

  function showAlert(msg, type = 'success') {
    const box = document.getElementById('alert-box');
    const el = document.createElement('div');
    el.className = `alert alert-${type}`;
    el.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
    box.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  function formatCOP(val) {
    const n = Math.round(Number(val));
    return '$' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
</script>

{% block scripts %}{% endblock %}
</body>
</html>
